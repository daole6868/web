<!doctype html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NOVA BOOST — Cày thuê game gacha uy tín – cày tay 100%</title>
  <meta name="description" content="Dịch vụ cày thuê Genshin Impact, Honkai: Star Rail, Wuthering Waves, Zenless Zone Zero, Arknights: Endfield, Neverness to Everness. Cày tay 100%, bảo mật, giá tốt.">
  <meta name="theme-color" content="#0b0d17">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c5cff'/%3E%3Cstop offset='1' stop-color='%2322d3ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cpath d='M20 44V20l24 24V20' stroke='white' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&family=Montserrat:wght@400;500;600;700;800&family=Nunito:wght@400;600;700;800&family=Lexend:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@600;700&family=Saira:wght@500;600;700;800&family=Exo+2:wght@600;700;800&family=Barlow+Condensed:ital,wght@0,700;0,800;1,800&family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/skins.css">
</head>
<body>
  <!-- Màn hình tải trang -->
  <div id="preloader" class="preloader" aria-hidden="true">
    <div class="preloader__logo"><span class="preloader__ring"></span><b id="preloader-text">N</b></div>
    <div class="preloader__bar"><i></i></div>
  </div>

  <!-- Màn hình chào (tuỳ chọn) — nhấn để vào trang + bật nhạc -->
  <div id="gate" class="gate" hidden>
    <div class="gate__inner">
      <div class="gate__logo" id="gate-logo">N</div>
      <h2 id="gate-title">Chào mừng bạn</h2>
      <p id="gate-sub">Nhấn để khám phá — kèm chút âm nhạc thư giãn 🎧</p>
      <button class="btn btn--primary btn--lg" id="gate-enter">Vào trang</button>
      <button class="gate__silent" id="gate-silent">Vào không kèm nhạc</button>
    </div>
  </div>

  <!-- Nền động -->
  <div class="bg-blobs" aria-hidden="true"><span></span><span></span><span></span></div>
  <canvas id="bg-canvas" aria-hidden="true"></canvas>
  <div class="bg-grid" aria-hidden="true"></div>
  <div id="cursor-glow" aria-hidden="true"></div>
  <div id="scroll-progress" aria-hidden="true"></div>

  <div id="announce" class="announce" hidden></div>

  <header id="header" class="header">
    <div class="container header__inner">
      <a href="#hero" class="logo" id="logo"></a>
      <nav class="nav" id="nav" aria-label="Điều hướng chính"></nav>
      <div class="header__actions">
        <div class="skin-pick" id="skin-pick">
          <button class="icon-btn" id="skin-btn" aria-label="Đổi phong cách giao diện" aria-expanded="false"></button>
          <div class="skin-menu" id="skin-menu"></div>
        </div>
        <button class="icon-btn" id="theme-toggle" aria-label="Đổi giao diện sáng/tối"></button>
        <a href="#contact" class="btn btn--primary btn--sm header__cta" id="header-cta">Liên hệ</a>
        <button class="icon-btn menu-btn" id="menu-btn" aria-label="Mở menu"></button>
      </div>
    </div>
  </header>

  <!-- Menu điện thoại -->
  <div class="mobile-menu" id="mobile-menu" aria-hidden="true">
    <div class="mobile-menu__panel">
      <nav id="mobile-nav"></nav>
    </div>
  </div>

  <main id="main"></main>

  <footer id="footer" class="footer"></footer>

  <!-- Nút liên hệ nổi -->
  <div class="fab-contact" id="fab-contact"></div>
  <button class="to-top" id="to-top" aria-label="Lên đầu trang"></button>

  <!-- Trình phát nhạc -->
  <div class="player" id="player" hidden></div>

  <!-- Hộp thoại -->
  <div class="modal" id="modal" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="modal__backdrop" data-close></div>
    <div class="modal__box" id="modal-box"></div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="js/store.js"></script>
  <script src="js/music.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
